<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医导图</title>
    <meta name="description" content="中医导图 - 中医学习工具">
    <meta name="theme-color" content="#1a237e">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="2.png" type="image/png">
    <link rel="apple-touch-icon" href="2.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: calc(100% + 60px);
            border: none;
            position: absolute;
            top: -60px;
            left: 0;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 30%, #283593 60%, #1565c0 100%);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .auth-overlay::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(100, 181, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(76, 175, 80, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(156, 39, 176, 0.05) 0%, transparent 70%);
            animation: floatGradient 15s ease-in-out infinite;
        }
        @keyframes floatGradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10%, 10%) rotate(5deg); }
        }
        .auth-overlay.hidden {
            display: none !important;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 60px 50px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #1e88e5, #43a047, #7b1fa2, #f57c00);
        }
        .auth-container::after {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(30, 136, 229, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .auth-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15),
                        0 0 0 3px rgba(255, 255, 255, 0.5) inset;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a237e;
            letter-spacing: 2px;
        }
        .auth-subtitle {
            font-size: 16px;
            color: #43a047;
            font-weight: 600;
            margin-bottom: 36px;
            letter-spacing: 1px;
        }
        .auth-mark-display {
            margin-bottom: 28px;
        }
        .auth-mark-label {
            font-size: 15px;
            color: #546e7a;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .auth-mark-value {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 20px;
            color: #1a237e;
            word-break: break-all;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) inset;
        }
        .auth-mark-copy {
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.35);
            letter-spacing: 0.5px;
        }
        .auth-mark-copy:hover {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(30, 136, 229, 0.45);
        }
        .auth-mark-copy:active {
            transform: translateY(-1px);
        }
        .auth-input-group {
            margin-bottom: 28px;
        }
        .auth-input {
            width: 100%;
            padding: 20px 24px;
            font-size: 20px;
            letter-spacing: 12px;
            text-align: center;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
            font-weight: 600;
            text-transform: uppercase;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            transition: all 0.3s ease;
        }
        .auth-input:focus {
            outline: none;
            border-color: #1e88e5;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.1);
        }
        .auth-input.error {
            border-color: #e53935;
            background: #fff5f5;
            animation: shake 0.5s ease;
            box-shadow: 0 0 0 4px rgba(229, 57, 53, 0.1);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .auth-hint {
            font-size: 13px;
            color: #90a4ae;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .auth-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(67, 160, 71, 0.35);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(67, 160, 71, 0.45);
        }
        .auth-btn:active {
            transform: translateY(-1px);
        }
        .auth-error-msg {
            color: #e53935;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 16px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid rgba(229, 57, 53, 0.2);
        }
        .auth-error-msg.show {
            display: flex;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 40px 28px;
                max-width: 95%;
            }
            .auth-title {
                font-size: 24px;
            }
            .auth-input {
                padding: 16px 20px;
                font-size: 18px;
                letter-spacing: 8px;
            }
            .auth-logo {
                width: 80px;
                height: 80px;
            }
            .auth-mark-value {
                font-size: 18px;
                padding: 16px 20px;
            }
        }

        .contact-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .contact-modal.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .contact-modal-content {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            animation: slideUp 0.4s ease;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .contact-modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #e53935, #ef5350, #e53935);
            border-radius: 28px 28px 0 0;
        }
        .contact-modal-content::after {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(229, 57, 53, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .contact-modal-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(229, 57, 53, 0.25),
                        0 0 0 3px rgba(255, 255, 255, 0.5) inset;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .contact-modal-icon svg {
            width: 42px;
            height: 42px;
            fill: #e53935;
        }
        .contact-modal-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .contact-modal-subtitle {
            font-size: 15px;
            color: #78909c;
            margin-bottom: 30px;
        }
        .contact-info-list {
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .contact-info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        .contact-info-item:last-child {
            border-bottom: none;
        }
        .contact-info-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: #546e7a;
            font-weight: 500;
        }
        .contact-info-label svg {
            width: 22px;
            height: 22px;
            fill: #43a047;
        }
        .contact-info-value {
            font-size: 16px;
            font-weight: 600;
            color: #1a237e;
            margin-left: 8px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
        }
        .contact-copy-btn {
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.35);
        }
        .contact-copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.45);
        }
        .contact-copy-btn:active {
            transform: translateY(-1px);
        }
        .contact-copy-btn svg {
            width: 15px;
            height: 15px;
            fill: white;
        }
        .contact-copy-btn.copied {
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            box-shadow: 0 4px 14px rgba(67, 160, 71, 0.35);
        }
        .contact-modal-btn {
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            color: white;
            border: none;
            padding: 16px 56px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(229, 57, 53, 0.35);
            letter-spacing: 0.5px;
        }
        .contact-modal-btn:hover {
            background: linear-gradient(135deg, #c62828 0%, #b71c1c 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(229, 57, 53, 0.45);
        }
        .contact-modal-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://www.kdocs.cn/l/canpmcatC0mS" id="mainIframe"></iframe>
    </div>

    <div class="auth-overlay hidden" id="authOverlay">
        <div class="auth-container">
            <div class="auth-logo">
                <img src="2.png" alt="中医导图">
            </div>
            <h2 class="auth-title"中医导图学习神器</h2>
            <p class="auth-subtitle">正版授权验证</p>

            <div class="auth-mark-display">
                <div class="auth-mark-label">此乃道友独特印记：</div>
                <div class="auth-mark-value" id="deviceMark">正在生成印记...</div>
                <button class="auth-mark-copy" id="copyMarkBtn">复制印记</button>
            </div>

            <div class="auth-input-group">
                <input type="text" class="auth-input" id="authPassword" placeholder="请输入激活码" autocomplete="off">
                <div class="auth-hint">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="#9E9E9E"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <span>激活码不区分大小写，同一设备只需验证一次</span>
                </div>
            </div>

            <button class="auth-btn" id="authSubmitBtn" onclick="verifyPassword()">验证并进入</button>

            <div class="auth-error-msg" id="authErrorMsg">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="#f44336"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span>验证码错误，请重试</span>
            </div>
        </div>
    </div>

    <div class="contact-modal" id="contactModal">
        <div class="contact-modal-content">
            <div class="contact-modal-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <div class="contact-modal-title">验证失败</div>
            <div class="contact-modal-subtitle">请联系客服获取帮助</div>

            <div class="contact-info-list">
                <div class="contact-info-item">
                    <div class="contact-info-label">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <span>微信公众号</span>
                        <span class="contact-info-value" id="wechatOfficial">一介医生</span>
                    </div>
                    <button class="contact-copy-btn" onclick="copyToClipboard('wechatOfficial', this)">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        <span>复制</span>
                    </button>
                </div>
                <div class="contact-info-item">
                    <div class="contact-info-label">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                        <span>微信号</span>
                        <span class="contact-info-value" id="wechatId">yijiedoctor</span>
                    </div>
                    <button class="contact-copy-btn" onclick="copyToClipboard('wechatId', this)">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        <span>复制</span>
                    </button>
                </div>
            </div>

            <button class="contact-modal-btn" onclick="closeContactModal()">我知道了</button>
        </div>
    </div>

    <script>
        function generateDeviceId() {
            const deviceId = Math.floor(Math.random() * 10000000000).toString().padStart(10, '0');
            return deviceId;
        }

        function getCookie(name) {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith(name + '='))
                ?.split('=')[1];
            return cookieValue;
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function initDeviceId() {
            let deviceId = localStorage.getItem('device_id');

            if (!deviceId) {
                deviceId = getCookie('device_id');
            }

            if (!deviceId) {
                deviceId = generateDeviceId();
                localStorage.setItem('device_id', deviceId);
                setCookie('device_id', deviceId, 3650);
            }

            return deviceId;
        }

        const deviceId = initDeviceId();

        function generateDeviceMark() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeStr = `${String(month).padStart(2, '0')}${String(day).padStart(2, '0')}${String(hours).padStart(2, '0')}${String(minutes).padStart(2, '0')}`;

            const mark = `J1${timeStr}${deviceId}`;
            return mark;
        }

        let currentDeviceMark = null;

        function getDeviceMark() {
            if (isDeviceVerified()) {
                currentDeviceMark = generateDeviceMark();
                return currentDeviceMark;
            }

            let storedMark = localStorage.getItem('pending_device_mark');
            if (storedMark) {
                currentDeviceMark = storedMark;
            } else {
                currentDeviceMark = generateDeviceMark();
                localStorage.setItem('pending_device_mark', currentDeviceMark);
            }
            return currentDeviceMark;
        }

        function calculateActivationCode(mark) {
            const last4 = mark.slice(-4);
            const hexToDec = parseInt(last4, 16);
            const timePart = mark.slice(2, 10);
            const timeLast4 = timePart.slice(4);
            const timeNum = parseInt(timeLast4);
            const activationCode = hexToDec + timeNum + 1111;
            return activationCode.toString();
        }

        function isDeviceVerified() {
            if (localStorage.getItem('tcm_auth_passed') === 'true') {
                return true;
            }
            if (localStorage.getItem('jingui_auth_passed') === 'true') {
                localStorage.setItem('tcm_auth_passed', 'true');
                return true;
            }
            return false;
        }

        function markDeviceVerified() {
            localStorage.setItem('tcm_auth_passed', 'true');
            localStorage.setItem('jingui_auth_passed', 'true');
            localStorage.removeItem('pending_device_mark');
        }

        function verifyPassword() {
            const input = document.getElementById('authPassword');
            const errorMsg = document.getElementById('authErrorMsg');
            const entered = input.value.trim();

            const deviceMarkElement = document.getElementById('deviceMark');
            const deviceMark = deviceMarkElement ? deviceMarkElement.textContent : getDeviceMark();
            const correct = calculateActivationCode(deviceMark);

            if (entered === correct) {
                markDeviceVerified();
                document.getElementById('authOverlay').classList.add('hidden');
                initApp();
            } else {
                input.classList.add('error');
                errorMsg.classList.add('show');
                input.value = '';
                setTimeout(() => {
                    input.classList.remove('error');
                }, 500);
                setTimeout(() => {
                    showContactModal();
                }, 500);
            }
        }

        function copyMarkToClipboard() {
            const deviceMarkElement = document.getElementById('deviceMark');
            const deviceMark = deviceMarkElement ? deviceMarkElement.textContent : getDeviceMark();
            navigator.clipboard.writeText(deviceMark).then(() => {
                const copyBtn = document.getElementById('copyMarkBtn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        }

        function showContactModal() {
            document.getElementById('contactModal').classList.add('show');
        }

        function closeContactModal() {
            document.getElementById('contactModal').classList.remove('show');
        }

        function copyToClipboard(elementId, btn) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>已复制</span>';

                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = originalHTML;
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);

                const originalHTML = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>已复制</span>';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }

        function initApp() {
            console.log('App initialized - main content would load here');
        }

        document.addEventListener('DOMContentLoaded', function() {
            function updateDeviceMark() {
                const deviceMark = getDeviceMark();
                const deviceMarkElement = document.getElementById('deviceMark');
                if (deviceMarkElement) {
                    deviceMarkElement.textContent = deviceMark;
                }
            }

            updateDeviceMark();

            const copyMarkBtn = document.getElementById('copyMarkBtn');
            if (copyMarkBtn) {
                copyMarkBtn.addEventListener('click', copyMarkToClipboard);
            }

            if (isDeviceVerified()) {
                initApp();
            } else {
                document.getElementById('authOverlay').classList.remove('hidden');
                document.getElementById('authPassword').focus();
                document.getElementById('authPassword').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') verifyPassword();
                });
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
